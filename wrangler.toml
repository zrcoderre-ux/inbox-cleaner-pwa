# Cloudflare Worker config for Inbox Cleaner.
#
# This deploys worker.js (which serves the static files AND the OAuth
# refresh-token endpoints). See AUTH-SETUP.md for the one-time setup.

name = "inbox-cleaner-pwa"
main = "worker.js"
compatibility_date = "2024-09-23"

# Serve the repo's static files (index.html, sw.js, manifest.json, icons)
# through the Worker. Requests that don't match the OAuth API fall through to
# these assets.
[assets]
directory = "."
binding = "ASSETS"

# Optional: override the OAuth client ID without editing code.
# [vars]
# GOOGLE_CLIENT_ID = "xxxxx.apps.googleusercontent.com"

# The client SECRET is set as an encrypted secret, NOT here:
#   npx wrangler secret put GOOGLE_CLIENT_SECRET

# Monthly character budget for read-aloud (see AUTH-SETUP.md). The Worker
# refuses to spend past the cap, counted across every device rather than
# per-browser, and refuses too when the meter can't be reached. A Durable
# Object holds the count because it can check and add in one step; the deploy
# creates it, so there is nothing to set up in the dashboard. Remove the
# binding and nothing is enforced — the app falls back to its own per-browser
# estimate.
[[durable_objects.bindings]]
name = "TTS_METER"
class_name = "TtsMeter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TtsMeter"]

# Where the budget was counted before the meter. Read once, the first time the
# meter starts, so the month already under way keeps what it had spent. Safe
# to delete from November 2026 on.
[[kv_namespaces]]
binding = "TTS_BUDGET"
id = "094a20c9d104450aaeb146bcc00a4145"

# Optional: override the monthly cap (default 950000, just under Google's
# 1,000,000-character free allowance).
# [vars]
# TTS_MONTHLY_CHAR_CAP = "950000"
